name: Fetch business listings

on:
  # schedule disabled while the businessId/PRH resolution change is still
  # being tested - re-enable once confirmed stable
  # schedule:
  #   - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new business listings
        env:
          LISTING_SITE_BASE_URL: ${{ secrets.LISTING_SITE_BASE_URL }}
        run: python fetch_business.py

      - name: Analyze new listings and send Telegram digest
        env:
          LISTING_SITE_BASE_URL: ${{ secrets.LISTING_SITE_BASE_URL }}
          RENTAL_SITE_BASE_URL: ${{ secrets.RENTAL_SITE_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analyze_and_notify.py

      - name: Commit updated seen-state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/business_seen.json
          git diff --staged --quiet || git commit -m "Update business listing seen-state [skip ci]"
          git push
