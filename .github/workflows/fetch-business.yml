name: Fetch business listings

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Restore rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Download current Excel file from Google Drive
        run: |
          rclone copyto "${{ vars.BUSINESS_EXCEL_CLOUD_PATH }}" business_listings.xlsx \
            || echo "No existing file in Google Drive yet, starting fresh."

      - name: Fetch new business listings and update Excel file
        env:
          BUSINESS_EXCEL_PATH: business_listings.xlsx
          LISTING_SITE_BASE_URL: ${{ secrets.LISTING_SITE_BASE_URL }}
        run: python fetch_business.py

      - name: Upload updated Excel file to Google Drive
        run: rclone copyto business_listings.xlsx "${{ vars.BUSINESS_EXCEL_CLOUD_PATH }}"
