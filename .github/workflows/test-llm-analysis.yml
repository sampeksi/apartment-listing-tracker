name: Test LLM analysis (temporary)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run a real analyze_listing() call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import json, requests
          from llm_analysis import analyze_listing
          from rent_comps import RentEstimate

          listing = requests.get(
              'https://www.etuovi.com/api/v2/announcement/details',
              params={'friendlyId': '80544569'},
          ).json()
          rent_estimate = RentEstimate(median_rent=750.0, median_rent_per_sqm=15.5, sample_size=42, widened_to_region=False)
          scenarios = {'conservative': {'netYieldBeforeTax': 0.10}}

          result = analyze_listing(listing, rent_estimate, scenarios)
          print(json.dumps(result, indent=2, ensure_ascii=False))
          "
